name: Release Workflow

on:
  push:
    tags:
      - "v*"

# Write scopes are granted per job, only where the job actually publishes
# something. Everything else runs read-only.
permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # xprem is the canonical image. The expo-open-ota path is kept in sync so
      # deployments made under the old project name keep pulling.
      - name: Build and push multi-platform Docker image
        run: |
          IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          REPO="ghcr.io/${{ github.repository_owner }}/xprem"
          DEPRECATED_REPO="ghcr.io/${{ github.repository_owner }}/expo-open-ota"

          echo "Building Docker image with tag: $IMAGE_TAG"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$IMAGE_TAG" \
            -t "$REPO:$IMAGE_TAG" \
            -t "$DEPRECATED_REPO:$IMAGE_TAG" \
            --push .

  helm:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Update Helm values.yaml
        run: |
          IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          sed -i "s/tag: .*/tag: ${IMAGE_TAG}/" helm/values.yaml

      # xprem is the canonical chart. A byte-identical copy goes out under the
      # old chart name so `helm upgrade` on existing releases keeps resolving.
      - name: Package Helm chart
        run: |
          IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          CHART_VERSION="${IMAGE_TAG#v}"
          helm package ./helm -d ./charts --version "$CHART_VERSION" --app-version "$IMAGE_TAG"
          sed -i 's/^name: xprem$/name: expo-open-ota/' helm/Chart.yaml
          helm package ./helm -d ./charts --version "$CHART_VERSION" --app-version "$IMAGE_TAG"
          sed -i 's/^name: expo-open-ota$/name: xprem/' helm/Chart.yaml

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Helm chart to GHCR
        run: |
          IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          CHART_VERSION="${IMAGE_TAG#v}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for CHART in xprem expo-open-ota; do
            helm push "./charts/${CHART}-${CHART_VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"
          done

      # Only the canonical chart ships as a release asset; the deprecated copy
      # exists for `helm upgrade` and has no reason to appear on the release.
      - name: Rename chart archive for release assets
        run: |
          IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          CHART_VERSION="${IMAGE_TAG#v}"
          rm -f "./charts/expo-open-ota-${CHART_VERSION}.tgz"
          mv "./charts/xprem-${CHART_VERSION}.tgz" "./charts/xprem-helm-charts-${IMAGE_TAG}.tgz"

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: ./charts/*.tgz

  npm:
    runs-on: ubuntu-latest
    # npm publish --provenance signs through Sigstore and needs an OIDC token.
    permissions:
      contents: read
      id-token: write
    strategy:
      # One package must not stop the other from being published, and a partial
      # release is easier to finish than to unpick.
      fail-fast: false
      matrix:
        include:
          - package: apps/eoas
            build: true
          - package: apps/control-center
            build: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # REF_NAME goes through env rather than a ${{ }} interpolation inside the
      # script: git allows quotes and semicolons in tag names, so interpolating
      # one straight into the shell would let whoever pushes the tag run
      # arbitrary commands in this job, which holds the npm publishing identity.
      - name: Publish NPM package
        env:
          REF_NAME: ${{ github.ref_name }}
          PACKAGE_DIR: ${{ matrix.package }}
          NEEDS_BUILD: ${{ matrix.build }}
        run: |
          cd "$PACKAGE_DIR"
          VERSION="${REF_NAME#v}"
          # ci only where a lockfile makes it reproducible; the picker package
          # has none, and ci refuses to run without one.
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if [ "$NEEDS_BUILD" = "true" ]; then
            npm run build
          fi
          # Ships TypeScript sources, so the compiler is the only thing standing
          # between a broken package and everyone who installs it.
          npm run typecheck --if-present
          # Fails here rather than on the registry if the files list is wrong,
          # and prints exactly what a consumer would receive.
          npm pack --dry-run
          npm version "$VERSION" --no-git-tag-version

          if echo "$VERSION" | grep -qE '\-(alpha|beta|rc)'; then
            NPM_TAG=$(echo "$VERSION" | grep -oE '(alpha|beta|rc)')
            echo "Pre-release detected, publishing with --tag $NPM_TAG"
            npm publish --access public --provenance --tag "$NPM_TAG"
          else
            npm publish --access public --provenance
          fi

  github-release:
    runs-on: ubuntu-latest
    needs: [helm, npm]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: ./charts

      - name: Compute release metadata
        run: |
          IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "CHART_VERSION=${IMAGE_TAG#v}" >> "$GITHUB_ENV"
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./charts/*.tgz
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body: |
            ## Changes
            - Docker image: `ghcr.io/${{ github.repository_owner }}/xprem:${{ github.ref_name }}`
            - Helm chart: `helm install xprem oci://ghcr.io/${{ env.OWNER }}/charts/xprem --version ${{ env.CHART_VERSION }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
