version: "2"
sql:
  - name: "postgres"
    engine: "postgresql"
    schema: "internal/database/postgres/migrations/"
    queries: "internal/database/postgres/queries/"
    gen:
      go:
        package: "pgdb"
        out: "internal/database/postgres/pgdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "updates.asset_mapping"
            go_type:
              import: "xprem/internal/types"
              type: "UpdateAssetMapping"
              pointer: true
          - column: "builds.status"
            go_type:
              import: "xprem/internal/types"
              type: "BuildStatus"
          - column: "bundle_patches.status"
            go_type:
              import: "xprem/internal/types"
              type: "BundlePatchStatus"
          - column: "app_identifiers.platform"
            go_type:
              import: "xprem/internal/types"
              type: "Platform"
          - column: "builds.platform"
            go_type:
              import: "xprem/internal/types"
              type: "Platform"
          - column: "builds.artifact_type"
            go_type:
              import: "xprem/internal/types"
              type: "BuildArtifactType"
          - column: "build_artifact_cleanup.platform"
            go_type:
              import: "xprem/internal/types"
              type: "Platform"
          - column: "build_artifact_cleanup.artifact_type"
            go_type:
              import: "xprem/internal/types"
              type: "BuildArtifactType"
          - column: "updates.platform"
            go_type:
              import: "xprem/internal/types"
              type: "Platform"
          - column: "ios_certificates.certificate_type"
            go_type:
              import: "xprem/internal/types"
              type: "IosCertificateType"
          - column: "ios_certificates.source"
            go_type:
              import: "xprem/internal/types"
              type: "IosCertificateSource"
          - column: "ios_signing_settings.mode"
            go_type:
              import: "xprem/internal/types"
              type: "IosSigningMode"
          - column: "ios_device_registrations.status"
            go_type:
              import: "xprem/internal/types"
              type: "IosDeviceRegistrationStatus"
          - column: "ios_device_invitations.created_by_actor_type"
            go_type:
              import: "xprem/internal/auditlog"
              type: "ActorType"
